name: Hiên Sách · iPhone
on:
  push:
    branches: [hien-sach]
    paths:
      - 'HienSach/**'
      - '.github/workflows/hien-sach.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-reader]')
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: HienSach
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Compile and package IPA
        run: bash Build/ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HienSach-iPhone
          path: HienSach/out/HienSach.ipa
          if-no-files-found: error
      - name: Test reading and importing on iPhone simulator
        run: bash Build/test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-verification
          path: HienSach/out/*.png
          if-no-files-found: ignore
