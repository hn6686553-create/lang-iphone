name: HienSach
options:
  bundleIdPrefix: io.github.hn6686553-create
  deploymentTarget:
    iOS: '17.0'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: '1,2'
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  HienSach:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets
      - path: Resources/Seeds
        type: folder
        buildPhase: resources
      - path: Resources/reader.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hn6686553-create.hiensach
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
    dependencies:
      - package: ZIPFoundation
  ReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HienSach
  ReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HienSach
schemes:
  HienSach:
    build:
      targets:
        HienSach: all
    test:
      targets: [ReaderTests, ReaderUITests]
      gatherCoverageData: false
